# Board description of the Microsoft Lumia 950 (MSM8992, Snapdragon 808), read by the unixnu
# build driver.
#
# P1 research skeleton. The incomplete-board guard is intentional: this board cannot build a
# boot image yet, and it must not pretend to. Unknown sections are absent rather than filled
# with zero addresses or invented hashes. Remove `example = true` only when every section
# below exists and has been checked on hardware.

[board]
name = "lumia950"
soc = "MSM8992"
description = "Microsoft Lumia 950 — P1 build research"
kit = "lumia950"                   # package/ of this repository becomes kits/lumia950
example = true

[kernel]
defconfig = "lumia950_defconfig"
# Archive builders of the kernel step, in order. Names are files of the build tree's
# scripts/ directory, so they carry no path. The corecrypto pair comes first because
# ArmCpu is only accepted with the real source crypto provider; ArmDTPlatform is the
# platform expert that consumes the ADT; ArmCpu owns the CPU, timer and interrupt path;
# NativeSdhci is this device's eMMC driver (see drivers/NativeSdhci and README.md).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeSdhci",
  # Link input, not a driver: upstream calls native_legacy_display_probe() from
  # bsd_init.c without the XNU_NATIVE_LEGACY_DISPLAY guard every other call site has,
  # so the kernel needs the symbol even with the flag off. The defconfig force-loads
  # this archive through XNU_EXTRA_LD_ARCHIVES.
  "build-arm-driver.py NativeLegacyDisplay",
  # "build-arm-driver.py NativeRamBlock",   # Data volume; also needs the virtio bindings builder
]
# TODO: obtain the real userdata GPT geometry (first_lba, last_lba) read-only from the phone.

# The Apple reference image: iPhone X, iOS 16.7.16. The port requires 16.x, so the kernel
# source and the kernelcache kexts come from the same line: feeds.toml pins
# xnu-8796.141.3 and patches/xnu-8796/ adapts the patch set to it. Prelink waits for a
# built kernel image (see the TODO below).
#
# The identity is the phone-shaped one: iPhone10,6 (d221ap), one of the two products this
# restore serves (iPhone10,3 is d22ap). The pinned values were read from the image's own
# BuildManifest over HTTP range requests, not from a listing.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,6"
version = "16.7.16"
build = "20H392"
device_class = "d221ap"
chip_id = 0x8015
board_id = 14
# DeviceTree and the trust caches join this list when the payload and boot stages exist and
# name their inputs.
fetch = ["KernelCache"]

# TODO: [kernel.prelink] returns when a 16.x kernel image exists to merge with this
#       kernelcache. The source line is settled: feeds.toml pins xnu-8796.141.3 and
#       patches/xnu-8796/ adapts the patch set to it — 47 base patches unchanged, 5 replaced
#       by their 8796 form, 7 skipped with a stated reason, and NativePrelink's kit patches
#       gated by their file name. What is missing is the image itself: the kernel job has to
#       compile and link the 16.x tree and leave the file this section names.

# [firmware] stays absent on purpose. The route is chainload: the phone's own UEFI
# (Lumia950XLPkg) starts \EFI\UniXNU\UniXNU.efi from EFIESP, so this repository builds no
# firmware volume and `unixnu build firmware` has nothing to do here. Mu-Silicium is not the
# base either: it has no MSM8992 target and its delivery model is an Android boot image for
# `fastboot boot`, which a Lumia does not have. See README.md, "The boot route".

# TODO: [payload] and [payload.adt], the driver's ramdisk payload for a boot image. The
#       chainload tree in payload/ is a different thing: files on EFIESP, staged by
#       scripts/build-payload.sh. When the kernel line opens, the two converge on the same
#       \EFI\UniXNU\Payloads layout, and this section names what the ADT generator emits.
#
#       The ADT generator exists: scripts/make-lumia950-adt.py, checked by scripts/check-adt.py
#       (the validate job runs both, including its defect self-test). It emits the Apple node
#       encoding with this SoC's addresses, a /chosen NVRAM proxy, the memory-map placeholders
#       and the identity properties; README.md carries the node spec.
#       What is still missing is the section itself: [payload] needs dram_size from the
#       firmware's memory map, not the 3 GiB marketing figure, because reserved regions carve
#       into it, and it needs a kernel to place next to the ADT.
